plugins { id 'com.android.application' }

// La llave de firma NO va en el repo: se lee de android/keystore.properties (ignorado por git)
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ks.load(new FileInputStream(ksFile))

android {
    namespace 'com.obrasnap.camara'
    compileSdk 35
    defaultConfig {
        applicationId 'com.obrasnap.camara'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        manifestPlaceholders = [hostName: '2351102227luis-source.github.io',
                                launchUrl: 'https://2351102227luis-source.github.io/obrasnap/']
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
